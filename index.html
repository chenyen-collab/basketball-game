<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校園投籃挑戰</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      background: #101827;
      color: #f8fafc;
      font-family: system-ui, "Microsoft JhengHei", sans-serif;
    }

    main {
      max-width: 900px;
      margin: auto;
    }

    header {
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
    }

    header p {
      color: #b8c6db;
      line-height: 1.6;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .stat {
      min-width: 120px;
      padding: 12px 20px;
      border-radius: 14px;
      background: #1e2b40;
      text-align: center;
    }

    .stat span {
      display: block;
      color: #b8c6db;
      font-size: 14px;
    }

    .stat strong {
      font-size: 28px;
    }

    canvas {
      display: block;
      width: 100%;
      background: #18283d;
      border: 1px solid #34465f;
      border-radius: 20px;
      touch-action: none;
      user-select: none;
    }

    .controls {
      text-align: center;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 28px;
      color: #172033;
      background: #ffb347;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #ffc574;
    }

    button:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    #message {
      min-height: 24px;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .note {
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 8px;
      }

      h1 {
        font-size: 26px;
      }

      .stats {
        gap: 8px;
      }

      .stat {
        min-width: 90px;
        padding: 10px 12px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>🏀 校園投籃挑戰</h1>
      <p>
        拖住籃球往左下方拉，放開後投籃！<br>
        拉得越遠，力道越大。沒有預測路徑，試試你的手感！
      </p>
    </header>

    <section class="stats" aria-label="遊戲資訊">
      <div class="stat">
        <span>目前得分</span>
        <strong id="score">0</strong>
      </div>

      <div class="stat">
        <span>剩餘秒數</span>
        <strong id="time">60</strong>
      </div>

      <div class="stat">
        <span>最高紀錄</span>
        <strong id="best">0</strong>
      </div>
    </section>

    <canvas
      id="court"
      width="900"
      height="560"
      aria-label="投籃遊戲球場。使用滑鼠或手指拖曳籃球投籃。"
    >
      你的瀏覽器不支援 Canvas，請使用支援 Canvas 的瀏覽器。
    </canvas>

    <div class="controls">
      <button id="start">開始遊戲</button>

      <p id="message" role="status" aria-live="polite">
        每次進球獲得 2 分，準備好挑戰最高分了嗎？
      </p>
    </div>

    <p class="note">最高紀錄儲存在此瀏覽器中。</p>
  </main>

  <script>
    const canvas = document.getElementById("court");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const bestEl = document.getElementById("best");
    const messageEl = document.getElementById("message");
    const startButton = document.getElementById("start");

    const W = 900;
    const H = 560;
    const FLOOR = 510;
    const GRAVITY = 820;
    const POWER = 5.2;
    const MAX_DRAG = 155;

    // 籃框反彈設定。
    const RIM_RADIUS = 5;
    const RIM_RESTITUTION = 0.88;

    const origin = { x: 205, y: 430 };
    const hoop = { left: 665, right: 765, y: 230 };
    const board = { x: 779, y: 120, width: 12, height: 135 };

    const ball = {
      x: origin.x,
      y: origin.y,
      vx: 0,
      vy: 0,
      r: 19
    };

    let score = 0;
    let best = 0;
    let remaining = 60;
    let running = false;
    let flying = false;
    let dragging = false;
    let scored = false;
    let drag = { x: 0, y: 0 };
    let pointerId = null;
    let deadline = 0;
    let lastTime = null;
    let shotAge = 0;
    let floorTimer = null;
    let rimFlash = 0;
    let scoreFlash = 0;

    try {
      const saved = Number(localStorage.getItem("basketballBest"));
      best = Number.isFinite(saved) ? Math.max(0, saved) : 0;
    } catch {
      // 無法使用本機儲存時，仍可正常遊玩。
    }

    bestEl.textContent = best;

    function setMessage(text) {
      messageEl.textContent = text;
    }

    function saveBest() {
      if (score <= best) return;

      best = score;
      bestEl.textContent = best;

      try {
        localStorage.setItem("basketballBest", String(best));
      } catch {
        // 本次開啟期間仍保留最高分。
      }
    }

    function cancelDrag() {
      dragging = false;

      const capturedId = pointerId;
      pointerId = null;
      drag = { x: 0, y: 0 };

      if (
        capturedId !== null &&
        canvas.hasPointerCapture(capturedId)
      ) {
        canvas.releasePointerCapture(capturedId);
      }
    }

    function resetBall() {
      cancelDrag();

      ball.x = origin.x;
      ball.y = origin.y;
      ball.vx = 0;
      ball.vy = 0;

      flying = false;
      scored = false;
      shotAge = 0;
      floorTimer = null;
    }

    function finishGame() {
      running = false;
      remaining = 0;
      timeEl.textContent = "0";

      cancelDrag();
      saveBest();

      startButton.textContent = "再玩一次";

      setMessage(
        `時間到！你得到 ${score} 分，最高紀錄是 ${best} 分。`
      );
    }

    startButton.addEventListener("click", () => {
      resetBall();

      score = 0;
      remaining = 60;
      rimFlash = 0;
      scoreFlash = 0;

      scoreEl.textContent = "0";
      timeEl.textContent = "60";

      deadline = performance.now() + 60000;
      running = true;
      startButton.textContent = "重新開始";

      setMessage("拖住籃球往左下拉，調整力道後放開投籃！");
    });

    // 將滑鼠或觸控座標轉換成球場座標。
    function getPoint(event) {
      const rect = canvas.getBoundingClientRect();

      return {
        x: (event.clientX - rect.left) * W / rect.width,
        y: (event.clientY - rect.top) * H / rect.height
      };
    }

    function updateDrag(event) {
      const p = getPoint(event);

      let dx = p.x - origin.x;
      let dy = p.y - origin.y;

      const length = Math.hypot(dx, dy);

      if (length > MAX_DRAG) {
        dx *= MAX_DRAG / length;
        dy *= MAX_DRAG / length;
      }

      drag = { x: dx, y: dy };
    }

    canvas.addEventListener("pointerdown", event => {
      if (!running || flying || dragging) return;

      if (
        event.pointerType === "mouse" &&
        event.button !== 0
      ) {
        return;
      }

      if (performance.now() >= deadline) {
        finishGame();
        return;
      }

      const p = getPoint(event);

      if (Math.hypot(p.x - ball.x, p.y - ball.y) > 45) {
        return;
      }

      event.preventDefault();

      pointerId = event.pointerId;
      dragging = true;

      canvas.setPointerCapture(pointerId);
      updateDrag(event);
    });

    canvas.addEventListener("pointermove", event => {
      if (dragging && event.pointerId === pointerId) {
        updateDrag(event);
      }
    });

    canvas.addEventListener("pointerup", event => {
      if (!dragging || event.pointerId !== pointerId) return;

      updateDrag(event);

      const dx = drag.x;
      const dy = drag.y;

      cancelDrag();

      if (!running || performance.now() >= deadline) {
        if (running) finishGame();
        return;
      }

      if (Math.hypot(dx, dy) < 8) {
        setMessage("多拉一點距離，才能投出籃球！");
        return;
      }

      // 球往拖曳方向的反方向飛行。
      ball.vx = -dx * POWER;
      ball.vy = -dy * POWER;
      flying = true;

      setMessage("籃球飛行中……");
    });

    canvas.addEventListener("pointercancel", event => {
      if (event.pointerId === pointerId) {
        cancelDrag();
      }
    });

    canvas.addEventListener("lostpointercapture", event => {
      if (event.pointerId === pointerId) {
        dragging = false;
        pointerId = null;
        drag = { x: 0, y: 0 };
      }
    });

    // 籃球碰到籃框兩端時，依照碰撞方向反彈。
    function collideRim(x, y) {
      const dx = ball.x - x;
      const dy = ball.y - y;
      const distance = Math.hypot(dx, dy);
      const minDistance = ball.r + RIM_RADIUS;

      if (distance >= minDistance) return false;

      const nx = distance > 0 ? dx / distance : 0;
      const ny = distance > 0 ? dy / distance : -1;

      // 將球推回籃框外，避免重疊或卡住。
      ball.x = x + nx * (minDistance + 0.1);
      ball.y = y + ny * (minDistance + 0.1);

      const normalSpeed = ball.vx * nx + ball.vy * ny;

      // 只有朝籃框移動時才反彈。
      if (normalSpeed < 0) {
        ball.vx -= (1 + RIM_RESTITUTION) * normalSpeed * nx;
        ball.vy -= (1 + RIM_RESTITUTION) * normalSpeed * ny;

        rimFlash = 0.18;
      }

      return true;
    }

    function updatePhysics(dt) {
      if (!flying || dt <= 0) return;

      shotAge += dt;

      // 分成小步長計算，減少快速移動時穿過籃框的情況。
      const steps = Math.ceil(dt / (1 / 240));
      const step = dt / steps;

      for (let i = 0; i < steps; i++) {
        const oldX = ball.x;
        const oldY = ball.y;

        ball.vy += GRAVITY * step;
        ball.x += ball.vx * step;
        ball.y += ball.vy * step;

        // 籃板碰撞。
        if (
          ball.y + ball.r > board.y &&
          ball.y - ball.r < board.y + board.height
        ) {
          if (
            ball.vx > 0 &&
            oldX + ball.r <= board.x &&
            ball.x + ball.r >= board.x
          ) {
            ball.x = board.x - ball.r;
            ball.vx *= -0.72;
          } else if (
            ball.vx < 0 &&
            oldX - ball.r >= board.x + board.width &&
            ball.x - ball.r <= board.x + board.width
          ) {
            ball.x = board.x + board.width + ball.r;
            ball.vx *= -0.72;
          }
        }

        const hitLeft = collideRim(hoop.left, hoop.y);
        const hitRight = collideRim(hoop.right, hoop.y);

        // 球從上往下穿過框口才得分，每球最多計分一次。
        if (
          running &&
          !scored &&
          !hitLeft &&
          !hitRight &&
          ball.vy > 0 &&
          oldY < hoop.y &&
          ball.y >= hoop.y
        ) {
          const ratio = (hoop.y - oldY) / (ball.y - oldY);
          const crossingX = oldX + (ball.x - oldX) * ratio;

          if (
            crossingX > hoop.left + ball.r + RIM_RADIUS &&
            crossingX < hoop.right - ball.r - RIM_RADIUS
          ) {
            scored = true;
            score += 2;
            scoreFlash = 0.8;

            scoreEl.textContent = score;
            saveBest();

            setMessage("漂亮！進球 +2 分 🎉");
          }
        }

        // 地面反彈。
        if (ball.y + ball.r >= FLOOR && ball.vy > 0) {
          ball.y = FLOOR - ball.r;
          ball.vy *= -0.42;
          ball.vx *= 0.72;

          if (floorTimer === null) {
            floorTimer = 0;
          }
        }
      }

      if (floorTimer !== null) {
        floorTimer += dt;
      }

      // 自動準備下一球。
      if (
        (floorTimer !== null && floorTimer > 0.45) ||
        shotAge > 5 ||
        ball.x < -80 ||
        ball.x > W + 80 ||
        ball.y > H + 80
      ) {
        const made = scored;

        resetBall();

        if (running && !made) {
          setMessage("再試一次！調整方向和力道。");
        }
      }
    }

    function drawBall() {
      ctx.save();
      ctx.translate(ball.x, ball.y);
      ctx.rotate(flying ? shotAge * 3 : 0);

      ctx.fillStyle = "#f58a28";
      ctx.beginPath();
      ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#5d2b12";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-ball.r, 0);
      ctx.lineTo(ball.r, 0);
      ctx.moveTo(0, -ball.r);
      ctx.lineTo(0, ball.r);
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(
        0,
        0,
        ball.r * 0.45,
        ball.r,
        0,
        0,
        Math.PI * 2
      );
      ctx.stroke();

      ctx.restore();
    }

    function drawHoop() {
      // 籃架與籃板。
      ctx.fillStyle = "#b8c9db";
      ctx.fillRect(807, 165, 10, 345);
      ctx.fillRect(board.x, board.y, board.width, board.height);

      ctx.strokeStyle = "#f8fafc";
      ctx.lineWidth = 3;
      ctx.strokeRect(738, 165, 40, 55);

      // 籃網。
      ctx.strokeStyle = "rgba(255,255,255,.65)";
      ctx.lineWidth = 2;

      for (let i = 0; i <= 5; i++) {
        const x = hoop.left + i * 20;
        const bottomX = hoop.left + 20 + i * 12;

        ctx.beginPath();
        ctx.moveTo(x, hoop.y + 5);
        ctx.lineTo(bottomX, hoop.y + 70);
        ctx.stroke();
      }

      for (let i = 1; i <= 3; i++) {
        const y = hoop.y + i * 18;
        const inset = i * 5;

        ctx.beginPath();
        ctx.moveTo(hoop.left + inset, y);
        ctx.lineTo(hoop.right - inset, y);
        ctx.stroke();
      }

      // 籃框被碰到時短暫亮起。
      const rimColor = rimFlash > 0
        ? "#ffe08a"
        : "#ff7147";

      ctx.strokeStyle = rimColor;
      ctx.lineWidth = 8;
      ctx.lineCap = "round";

      ctx.beginPath();
      ctx.moveTo(hoop.left, hoop.y);
      ctx.lineTo(hoop.right, hoop.y);
      ctx.stroke();

      ctx.lineCap = "butt";
      ctx.fillStyle = rimColor;

      for (const x of [hoop.left, hoop.right]) {
        ctx.beginPath();
        ctx.arc(x, hoop.y, RIM_RADIUS, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawAim() {
      if (!dragging) return;

      // 只顯示拖曳方向，不顯示預測飛行路徑。
      ctx.strokeStyle = "#ffcf78";
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(origin.x, origin.y);
      ctx.lineTo(origin.x + drag.x, origin.y + drag.y);
      ctx.stroke();

      const power = Math.round(
        Math.hypot(drag.x, drag.y) / MAX_DRAG * 100
      );

      ctx.fillStyle = "#ffcf78";
      ctx.font = "bold 20px system-ui";
      ctx.fillText(`力道 ${power}%`, 30, 45);

      // 力道條。
      ctx.fillStyle = "rgba(255,255,255,.15)";
      ctx.fillRect(30, 60, 150, 10);

      ctx.fillStyle = "#ffcf78";
      ctx.fillRect(30, 60, 150 * power / 100, 10);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      const background = ctx.createLinearGradient(0, 0, 0, H);
      background.addColorStop(0, "#142236");
      background.addColorStop(1, "#28435e");

      ctx.fillStyle = background;
      ctx.fillRect(0, 0, W, H);

      // 球場地板。
      ctx.fillStyle = "#b87949";
      ctx.fillRect(0, FLOOR, W, H - FLOOR);

      ctx.strokeStyle = "#efc39b";
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(0, FLOOR);
      ctx.lineTo(W, FLOOR);
      ctx.stroke();

      drawHoop();
      drawAim();
      drawBall();

      // 提示可以拖曳的位置。
      if (!flying && !dragging && running) {
        ctx.strokeStyle = "rgba(255,207,120,.65)";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.arc(origin.x, origin.y, 32, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 進球提示。
      if (scoreFlash > 0 && running) {
        ctx.save();

        ctx.globalAlpha = Math.min(1, scoreFlash / 0.3);
        ctx.fillStyle = "#ffe08a";
        ctx.font = "bold 32px system-ui";
        ctx.textAlign = "center";

        ctx.fillText(
          "+2",
          (hoop.left + hoop.right) / 2,
          hoop.y - 45
        );

        ctx.restore();
      }

      // 開始與結束畫面。
      if (!running) {
        ctx.fillStyle = "rgba(10,18,30,.55)";
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 34px system-ui";

        ctx.fillText(
          remaining === 0 ? "挑戰結束！" : "60 秒投籃挑戰",
          W / 2,
          330
        );

        ctx.font = "20px system-ui";

        ctx.fillText(
          remaining === 0
            ? `本次得分：${score} 分`
            : "按下下方按鈕開始遊戲",
          W / 2,
          370
        );

        ctx.textAlign = "left";
      }
    }

    function frame(now) {
      const dt = lastTime === null
        ? 0
        : Math.min((now - lastTime) / 1000, 0.04);

      lastTime = now;

      if (running) {
        remaining = Math.max(
          0,
          Math.ceil((deadline - now) / 1000)
        );

        timeEl.textContent = remaining;

        if (now >= deadline) {
          finishGame();
        }
      }

      rimFlash = Math.max(0, rimFlash - dt);
      scoreFlash = Math.max(0, scoreFlash - dt);

      updatePhysics(dt);
      draw();

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
